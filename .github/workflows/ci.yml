name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Shell syntax check
        run: bash -n install.sh uninstall.sh scripts/*.sh tests/*.sh
      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py runtimes/hermes/__init__.py
      - name: Release archive contract
        run: |
          bash scripts/build-release.sh "$RUNNER_TEMP/gwcu-release"
          version="$(tr -d '[:space:]' < VERSION)"
          test -s "$RUNNER_TEMP/gwcu-release/gwcu-$version.tar.gz"
          test -s "$RUNNER_TEMP/gwcu-release/gwcu-$version.json"
      - name: Skill UX contract
        run: bash ./tests/skill-ux.sh
      - name: Foreground action documentation
        run: bash ./tests/foreground-docs.sh
      - name: End-to-end latency and routing guards
        run: bash ./tests/latency-routing.sh
      - name: Truth scope isolation
        run: bash ./tests/truth-scope.sh
      - name: Standalone WORLDLINE test dependency
        run: |
          git clone --quiet https://github.com/ryanraposo/WORLDLINE.git "$RUNNER_TEMP/worldline"
          git -C "$RUNNER_TEMP/worldline" checkout --quiet 56ca67c
          echo "WORLDLINE_SOURCE=$RUNNER_TEMP/worldline" >> "$GITHUB_ENV"
      - name: One-call action spans
        run: bash ./tests/action-span.sh
      - name: WORLDLINE revision runtime
        run: bash ./tests/worldline.sh
      - name: Published-main migration
        run: bash ./tests/main-migration.sh
      - name: Lifecycle and security seams
        run: bash ./tests/lifecycle-safety.sh
      - name: Determinism contract
        run: bash ./tests/determinism.sh
      - name: Hermes policy integration
        run: bash ./tests/hermes.sh
      - name: Regression suite
        run: ./tests/run.sh
