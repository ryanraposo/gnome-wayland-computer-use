<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gnome-wayland-computer-use</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            color: #000;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px
        }

        main {
            max-width: 560px;
            width: 100%
        }

        h1 {
            font-size: 1.8em;
            letter-spacing: -.5px;
            text-align: center
        }

        p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            text-align: center
        }

        .curl-wrap {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0
        }

        .curl-code {
            font-family: inherit;
            font-size: 13px;
            white-space: nowrap;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none
        }

        .curl-code::-webkit-scrollbar {
            display: none
        }

        .curl-btn {
            flex-shrink: 0;
            background: none;
            border: 1px solid #bbb;
            border-radius: 5px;
            cursor: pointer;
            padding: 5px 7px;
            line-height: 0;
            color: #666;
            transition: .15s
        }

        .curl-btn:hover {
            background: #eaeaea;
            border-color: #888;
            color: #000
        }

        .btn {
            border: 2px solid #000;
            border-radius: 8px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            background: #fff;
            color: #000;
            text-decoration: none;
            display: inline-block;
            transition: .15s
        }

        .btn:hover {
            background: #000;
            color: #fff
        }

        .links {
            text-align: center;
            font-size: 13px;
            padding: 32px 0 0;
            color: #999;
            white-space: nowrap
        }

        .links a {
            color: #000;
            text-decoration: none
        }

        .links a:hover {
            text-decoration: underline
        }
    </style>
</head>

<body>
    <main>
        <h1>gnome-wayland-computer-use</h1>
        <p style="margin-top:6px">Fix <code>computer_use</code> on GNOME Wayland</p>

        <div class="curl-wrap">
            <span class="curl-code" id="curl">curl -fsSL
                https://ryanraposo.github.io/gnome-wayland-computer-use/install.sh | bash</span>
            <button class="curl-btn" id="copy" onclick="copyCurl()" title="Copy to clipboard">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="10" height="12" rx="1" />
                    <path d="M5 1h6a1 1 0 0 1 1 1v2" />
                </svg>
            </button>
        </div>

        <p style="font-size:13px;color:#555">Then <strong>log out and log back in</strong>.</p>

        <div class="links">
            <a href="https://github.com/ryanraposo/gnome-wayland-computer-use">github</a> ·
            ⚕ <a href="https://github.com/nousresearch/hermes-agent">hermes</a> ·
            extension by <a href="https://github.com/trycua">trycua</a> ·
            skill and installer by <a href="https://github.com/ryanraposo">ryanraposo</a>
        </div>
    </main>

    <script>
        function copyCurl() {
            navigator.clipboard.writeText(document.getElementById('curl').textContent);
            const b = document.getElementById('copy');
            b.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6 11.5 13 4.5"/></svg>';
            setTimeout(() => {
                b.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="10" height="12" rx="1"/><path d="M5 1h6a1 1 0 0 1 1 1v2"/></svg>';
            }, 1500);
        }
    </script>
</body>

</html>
